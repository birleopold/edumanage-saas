{% if device %}
<script>
(function () {
  var setup = document.querySelector('[data-attendance-setup]');
  if (!setup) return;
  var statusUrl = "{% url 'admin_attendance_device_setup_status' device.pk %}";
  var storageKey = 'edumanage-attendance-setup-state-{{ device.pk }}';
  async function checkConnection() {
    try {
      var response = await fetch(statusUrl, {headers: {'Accept': 'application/json'}, credentials: 'same-origin'});
      if (!response.ok) return;
      var data = await response.json();
      var previous = sessionStorage.getItem(storageKey);
      sessionStorage.setItem(storageKey, data.code || '');
      if (previous && previous !== data.code && !document.getElementById('device-secret')) {
        window.location.reload();
      }
    } catch (error) {
      // Connection polling is best-effort; the setup page remains fully usable offline.
    }
  }
  checkConnection();
  window.setInterval(checkConnection, 7000);
})();
</script>
{% endif %}
