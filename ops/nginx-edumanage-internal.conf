upstream edumanage_backend { server unix:/run/edumanage/edumanage.sock fail_timeout=0; }
upstream hotspot_app { server unix:/run/hotspot/gunicorn.sock; }

server {
 listen 127.0.0.1:18082;
 server_name _;
 location = /_internal/caddy/allow-domain {
  proxy_pass http://edumanage_backend;
  proxy_http_version 1.1;
  proxy_set_header Host edumanage.leosoftug.com;
  proxy_set_header X-Forwarded-Host edumanage.leosoftug.com;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_redirect off;
 }
 location / { return 404; }
}


server {
 listen 127.0.0.1:18081 default_server;
 server_name edumanage.leosoftug.com *.schools.leosoftug.com _;
 client_max_body_size 30M;
 location /static/ { alias /srv/edumanage/app/staticfiles/; access_log off; expires 30d; add_header Cache-Control "public, max-age=2592000"; }
 location /media/ { alias /srv/edumanage/app/media/; expires 7d; add_header Cache-Control "public, max-age=604800"; }
 location / {
  proxy_pass http://edumanage_backend; proxy_http_version 1.1;
  proxy_set_header Host $host; proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https; proxy_connect_timeout 30s; proxy_send_timeout 120s; proxy_read_timeout 120s; proxy_redirect off;
 }
}
server { listen 127.0.0.1:18081; server_name schools.leosoftug.com; return 302 https://edumanage.leosoftug.com/platform/login/; }

server {
 listen 127.0.0.1:18081; server_name hotspotcloud.net www.hotspotcloud.net;
 include snippets/deny-hidden-files.conf; client_max_body_size 20M;
 location /static/ { alias /home/admin/hotspot/django_hotspot/staticfiles/; expires 30d; add_header Cache-Control "public"; }
 location / { proxy_pass http://hotspot_app; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; proxy_redirect off; proxy_connect_timeout 120; proxy_send_timeout 120; proxy_read_timeout 120; }
}
server {
 listen 127.0.0.1:18081; server_name signalsolid.com www.signalsolid.com;
 include snippets/deny-hidden-files.conf; client_max_body_size 20M;
 location /static/ { alias /home/admin/signalsolid/staticfiles/; expires 30d; add_header Cache-Control "public, immutable"; }
 location /media/ { alias /home/admin/signalsolid/media/; expires 7d; add_header Cache-Control "public"; }
 location / { proxy_pass http://unix:/home/admin/signalsolid/signalsolid.sock; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; proxy_redirect off; proxy_connect_timeout 120; proxy_send_timeout 120; proxy_read_timeout 120; }
}
server {
 listen 127.0.0.1:18081; server_name leosoftug.com www.leosoftug.com;
 client_max_body_size 25M; access_log /var/log/nginx/leosoftug.com.access.log; error_log /var/log/nginx/leosoftug.com.error.log;
 include /etc/nginx/snippets/leosoft-protected-media.conf;
 location /static/ { alias /home/admin/All-tech-hub/staticfiles/; access_log off; expires 30d; add_header Cache-Control "public, immutable"; }
 location /media/ { alias /home/admin/All-tech-hub/media/; access_log off; expires 7d; add_header Cache-Control "public"; autoindex off; }
 location / { proxy_pass http://127.0.0.1:8010; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-Host $host; proxy_redirect off; proxy_connect_timeout 10s; proxy_read_timeout 120s; proxy_send_timeout 120s; }
}
