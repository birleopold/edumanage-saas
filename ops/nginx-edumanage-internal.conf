# Internal-only EduManage upstream for Caddy.
# Install as /etc/nginx/sites-available/edumanage-internal after Caddy takes ports 80/443.
server {
    listen 127.0.0.1:8080 default_server;
    server_name _;

    client_max_body_size 20m;

    location /static/ {
        alias /srv/edumanage/app/staticfiles/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        alias /srv/edumanage/app/media/;
        access_log off;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_pass http://unix:/run/edumanage/edumanage.sock;
    }
}
