# Internal HTTP edge behind Caddy. Generated from the existing VPS virtual-host
# behavior: Caddy forwards the original Host header and Nginx retains routing.
# This file is a cutover template; existing site location/upstream blocks should
# be transformed from public 80/443 listeners to 127.0.0.1:18081 while removing
# ssl_certificate directives. Do not replace application-specific location
# blocks with a generic proxy.
#
# Required invariant after cutover:
#   Caddy -> 127.0.0.1:18081 -> existing Nginx vhost -> existing app upstream.
#
# EduManage catch-all for approved custom domains belongs in the EduManage
# internal vhost as the default_server on 127.0.0.1:18081. Known Hotspot,
# SignalSolid and leosoftug.com server_name blocks must remain more specific.
